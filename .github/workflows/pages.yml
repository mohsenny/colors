# Build on every push to main and publish the result to GitHub Pages.
#
# The app is static: a bundle, a stylesheet and one HTML file, with the whole
# simulation running in the browser. So there is nothing to host but files, and
# the only job here is to make sure the files are the ones the tests passed on.
name: Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight build, but never a deploy half way
# through: cancelling mid-deploy is how a site ends up serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci`, with one retry.
      #
      # npm itself fails intermittently here with "Exit handler never called",
      # a bug in npm and not in this lockfile: the install finishes and the
      # process hangs on the way out. It took down the first deploy of this
      # repo. A clean cache and a second attempt clears it, and a retry is
      # honest about what it is rather than pinning a different npm and
      # pretending the problem is ours.
      - name: Install
        run: |
          npm ci --no-audit --no-fund || {
            echo "npm ci failed, clearing the cache and retrying once"
            npm cache clean --force
            rm -rf node_modules
            npm ci --no-audit --no-fund
          }
      # Typecheck, lint and unit tests before the build, so a broken simulation
      # cannot reach the live page. `npm run build` runs tsc itself, but failing
      # here names which check failed instead of just "build failed".
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
