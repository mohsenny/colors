# Build on every push to main and publish the result to GitHub Pages.
#
# The app is static: a bundle, a stylesheet and one HTML file, with the whole
# simulation running in the browser. So there is nothing to host but files, and
# the only job here is to make sure the files are the ones the tests passed on.
name: Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight build, but never a deploy half way
# through: cancelling mid-deploy is how a site ends up serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No lockfile to key a cache on, see the install step below.
      # Resolve from the public registry, ignoring the committed lockfile.
      #
      # The lockfile was generated behind a corporate JFrog mirror, so every one
      # of its `resolved` URLs points at a host no runner can reach. `npm ci`
      # hangs on the first tarball and then dies claiming "Exit handler never
      # called", which reads like an npm bug and is really a network it cannot
      # get to. Dropping the lockfile here makes the runner resolve the ranges
      # in package.json from registry.npmjs.org.
      #
      # The cost is real: CI is no longer installing the exact tree that was
      # tested locally, only a compatible one. The fix is a lockfile with public
      # URLs in it, and then this goes back to being `npm ci`.
      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      # Typecheck, lint and unit tests before the build, so a broken simulation
      # cannot reach the live page. `npm run build` runs tsc itself, but failing
      # here names which check failed instead of just "build failed".
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
